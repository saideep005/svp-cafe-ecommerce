<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Order Successful - SVP Cafe</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

<style>

body{
    background:#f5f5f5;
    font-family:Arial, sans-serif;
}

.success-box{
    width:550px;
    margin:120px auto;
    background:white;
    padding:50px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.success-icon{
    font-size:80px;
    color:green;
}

.success-box h1{
    color:#4b2e2b;
    margin:20px 0;
}

.success-box p{
    font-size:20px;
    color:#555;
    margin:15px 0;
}

.total{
    font-size:28px;
    color:#ff9800;
    font-weight:bold;
    margin:20px 0;
}

.home-btn{
    display:inline-block;
    margin-top:25px;
    padding:15px 35px;
    background:#ff9800;
    color:white;
    text-decoration:none;
    border-radius:8px;
    font-size:18px;
    transition:.3s;
}

.home-btn:hover{
    background:#ff6f00;
}

</style>

</head>

<body>

<div class="success-box">

<div class="success-icon">
✅
</div>

<h1>Order Placed Successfully!</h1>

<p>Thank you for ordering from <strong>SVP Cafe</strong>.</p>

<p>Your order has been received and will be prepared shortly.</p>

<div class="total">
Total Paid: ₹{{ total }}
</div>

<a href="/menu" class="home-btn">
Back to Menu
</a>

</div>

</body>

</html>
