<!DOCTYPE html>
<html>
<head>
    <title>My Wishlist</title>

    <style>

        body{
            font-family:Arial;
            background:#f5f5f5;
            margin:0;
        }

        h1{
            text-align:center;
            color:#2e7d32;
            margin-top:30px;
        }

        table{
            width:90%;
            margin:30px auto;
            border-collapse:collapse;
            background:white;
        }

        th,td{
            border:1px solid #ddd;
            padding:15px;
            text-align:center;
        }

        th{
            background:#2e7d32;
            color:white;
        }

        img{
            width:80px;
            height:80px;
            object-fit:cover;
            border-radius:8px;
        }

        .btn{
            padding:8px 15px;
            text-decoration:none;
            color:white;
            border-radius:5px;
        }

        .cart{
            background:#2e7d32;
        }

        .remove{
            background:red;
        }

        .back{
            display:block;
            width:180px;
            margin:20px auto;
            text-align:center;
            background:#2196f3;
            color:white;
            padding:12px;
            text-decoration:none;
            border-radius:5px;
        }

    </style>

</head>

<body>

<h1>❤️ My Wishlist</h1>

<table>

<tr>
    <th>Image</th>
    <th>Product</th>
    <th>Price</th>
    <th>Category</th>
    <th>Stock</th>
    <th>Move To Cart</th>
    <th>Remove</th>
</tr>

{% for item in wishlist_items %}

<tr>

    <td>
        <img src="{{ url_for('static', filename='images/' + item[3]) }}">
    </td>

    <td>{{ item[1] }}</td>

    <td>₹{{ item[2] }}</td>

    <td>{{ item[4] }}</td>

    <td>{{ item[5] }}</td>

    <td>
        <a href="/add_to_cart/{{ item[0] }}" class="btn cart">
            Add To Cart
        </a>
    </td>

    <td>
        <a href="/remove_from_wishlist/{{ item[0] }}" class="btn remove">
            Remove
        </a>
    </td>

</tr>

{% endfor %}

</table>

<a href="/menu" class="back">
    Back To Menu
</a>

</body>
</html>
