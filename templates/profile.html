<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f4f4;
            margin:0;
            padding:0;
        }

        .container{
            width:450px;
            margin:50px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        h2{
            text-align:center;
            color:#2c3e50;
        }

        p{
            font-size:18px;
            margin:15px 0;
        }

        strong{
            color:#333;
        }

        .btn{
            display:block;
            text-align:center;
            background:green;
            color:white;
            padding:12px;
            text-decoration:none;
            border-radius:5px;
            margin-top:20px;
        }

        .btn:hover{
            background:darkgreen;
        }

    </style>

</head>

<body>

<div class="container">

<h2>👤 My Profile</h2>

<p><strong>Full Name :</strong> {{ user[0] }}</p>

<p><strong>Email :</strong> {{ user[1] }}</p>

<p><strong>Username :</strong> {{ user[2] }}</p>

<p><strong>Phone :</strong> {{ user[3] }}</p>

<p><strong>Address :</strong> {{ user[4] }}</p>

<a href="/edit_profile" class="btn">
✏ Edit Profile
</a>

<a href="/change_password" class="btn">
🔒 Change Password
</a>

<a href="/menu" class="btn">
⬅ Back to Menu
</a>

</div>

</body>
</html>
