<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>

    <style>

        body{
            font-family:Arial;
            background:#f2f2f2;
        }

        .container{
            width:400px;
            margin:100px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            text-align:center;
            box-shadow:0 0 10px gray;
        }

        input{
            width:90%;
            padding:10px;
            margin:10px;
        }

        button{
            padding:10px 25px;
            background:green;
            color:white;
            border:none;
            cursor:pointer;
        }

    </style>

</head>

<body>

<div class="container">

<h2>Forgot Password</h2>

<form method="POST">

<input
type="email"
name="email"
placeholder="Enter your registered email"
required>

<br>

<button type="submit">
Send OTP
</button>

</form>

</div>

</body>

</html>
