<!DOCTYPE html>
<html>
<head>
    <title>Edit Product</title>
    <style>
        body{
            font-family:Arial,sans-serif;
            background:#f5f5f5;
            margin:0;
            padding:0;
        }

        .container{
            width:450px;
            margin:40px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            color:brown;
        }

        input{
            width:100%;
            padding:10px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:5px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:12px;
            background:green;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:darkgreen;
        }

        .back{
            display:inline-block;
            margin-top:15px;
            text-decoration:none;
            color:brown;
        }
    </style>
</head>
<body>

<div class="container">

<h2>Edit Product</h2>

<form method="POST">

    <input
        type="text"
        name="product_name"
        value="{{ product[1] }}"
        required>

    <input
        type="number"
        name="price"
        value="{{ product[2] }}"
        required>

    <input
        type="number"
        name="stock"
        value="{{ product[5] }}"
        placeholder="Stock"
        required>

    <input
        type="text"
        name="image"
        value="{{ product[3] }}"
        placeholder="Image File Name"
        required>

    <button type="submit">
        Update Product
    </button>

</form>

<a href="/view_products" class="back">← Back to Products</a>

</div>

</body>
</html>
