<!DOCTYPE html>
<html>
<head>

    <title>Sales Report - SVP Cafe</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#f4f4f4;
        }

        header{
            background:#6F4E37;
            color:white;
            padding:25px;
            text-align:center;
        }

        .container{
            width:90%;
            margin:40px auto;
        }

        .title{
            text-align:center;
            color:#6F4E37;
            margin-bottom:30px;
        }

        .cards{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:20px;
            margin-bottom:30px;
        }

        .card{
            background:white;
            padding:30px;
            text-align:center;
            border-radius:12px;
            box-shadow:0 5px 15px rgba(0,0,0,.15);
        }

        .card h2{
            color:#6F4E37;
            margin-bottom:15px;
            font-size:22px;
        }

        .card h1{
            color:green;
            font-size:35px;
        }

        .extra-cards{
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:20px;
        }

        .extra-card{
            background:white;
            padding:30px;
            text-align:center;
            border-radius:12px;
            box-shadow:0 5px 15px rgba(0,0,0,.15);
        }

        .extra-card h2{
            color:#6F4E37;
            margin-bottom:15px;
        }

        .extra-card h1{
            color:#ff9800;
            font-size:35px;
        }

        .back{
            display:block;
            width:220px;
            margin:40px auto;
            padding:15px;
            text-align:center;
            text-decoration:none;
            background:#6F4E37;
            color:white;
            border-radius:8px;
            font-size:18px;
            font-weight:bold;
        }

        .back:hover{
            background:#4b2e2b;
        }

        @media(max-width:768px){

            .cards{
                grid-template-columns:1fr;
            }

            .extra-cards{
                grid-template-columns:1fr;
            }

        }

    </style>

</head>

<body>

<header>

    <h1>☕ SVP Cafe</h1>
    <p>Admin Sales Report</p>

</header>

<div class="container">

    <h1 class="title">
        📊 Sales Report
    </h1>


    <!-- Main Statistics -->

    <div class="cards">

        <div class="card">

            <h2>🛒 Total Orders</h2>

            <h1>
                {{ total_orders }}
            </h1>

        </div>


        <div class="card">

            <h2>💰 Total Revenue</h2>

            <h1>
                ₹{{ total_revenue }}
            </h1>

        </div>


        <div class="card">

            <h2>📦 Products Sold</h2>

            <h1>
                {{ total_products_sold }}
            </h1>

        </div>

    </div>


    <!-- Daily / Monthly -->

    <div class="extra-cards">

        <div class="extra-card">

            <h2>📅 Today's Revenue</h2>

            <h1>
                ₹{{ today_revenue }}
            </h1>

        </div>


        <div class="extra-card">

            <h2>📆 This Month's Revenue</h2>

            <h1>
                ₹{{ month_revenue }}
            </h1>

        </div>

    </div>


    <a href="/admin_dashboard" class="back">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
