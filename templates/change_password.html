<!DOCTYPE html>
<html>
<head>
    <title>Change Password</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f4f4;
        }

        .container{
            width:450px;
            margin:50px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        h2{
            text-align:center;
            color:#2c3e50;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:8px;
            margin-bottom:18px;
            border:1px solid #ccc;
            border-radius:5px;
            font-size:16px;
        }

        button{
            width:100%;
            padding:12px;
            background:green;
            color:white;
            border:none;
            border-radius:5px;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:darkgreen;
        }

        .back{
            display:block;
            text-align:center;
            margin-top:20px;
            text-decoration:none;
            background:#555;
            color:white;
            padding:12px;
            border-radius:5px;
        }

        .back:hover{
            background:#333;
        }

    </style>

</head>

<body>

<div class="container">

<h2>🔒 Change Password</h2>

<form method="POST">

<label>Current Password</label>
<input
type="password"
name="current_password"
required>

<label>New Password</label>
<input
type="password"
name="new_password"
required>

<label>Confirm New Password</label>
<input
type="password"
name="confirm_password"
required>

<button type="submit">
Update Password
</button>

</form>

<a href="/profile" class="back">
⬅ Back to Profile
</a>

</div>

</body>
</html>
