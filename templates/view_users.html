<!DOCTYPE html>
<html>

<head>

    <title>View Users</title>

    <style>

        *{
            box-sizing:border-box;
        }

        body{
            font-family:Arial,sans-serif;
            background:#f5f5f5;
            padding:30px;
            margin:0;
        }

        h2{
            text-align:center;
            color:#6F4E37;
            margin-bottom:25px;
        }

        /* Back Button */

        .back{
            display:inline-block;
            margin-bottom:20px;
            padding:10px 18px;
            background:#6F4E37;
            color:white;
            text-decoration:none;
            border-radius:5px;
        }

        .back:hover{
            background:#4b2e2b;
        }

        /* Search Box */

        .search-box{
            background:white;
            padding:25px;
            border-radius:10px;
            margin-bottom:25px;
            box-shadow:0 5px 15px rgba(0,0,0,.15);
        }

        .search-box form{
            display:flex;
            justify-content:center;
            align-items:center;
            gap:12px;
            flex-wrap:wrap;
        }

        .search-box input{
            width:350px;
            padding:12px;
            border:1px solid #ccc;
            border-radius:6px;
            font-size:15px;
        }

        .search-box button{
            padding:12px 22px;
            background:#6F4E37;
            color:white;
            border:none;
            border-radius:6px;
            cursor:pointer;
            font-size:15px;
        }

        .search-box button:hover{
            background:#4b2e2b;
        }

        .clear-btn{
            padding:12px 22px;
            background:#777;
            color:white;
            text-decoration:none;
            border-radius:6px;
        }

        .clear-btn:hover{
            background:#555;
        }

        /* Table */

        .table-container{
            overflow-x:auto;
            background:white;
            border-radius:10px;
            box-shadow:0 5px 15px rgba(0,0,0,.15);
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }

        th,
        td{
            border:1px solid #ccc;
            padding:12px;
            text-align:center;
        }

        th{
            background:#6F4E37;
            color:white;
        }

        tr:hover{
            background:#f9f3ef;
        }

        .no-users{
            text-align:center;
            color:red;
            padding:25px;
            font-size:18px;
        }

        @media(max-width:768px){

            body{
                padding:15px;
            }

            .search-box form{
                flex-direction:column;
            }

            .search-box input,
            .search-box button,
            .clear-btn{
                width:100%;
            }

        }

    </style>

</head>

<body>

<a href="/admin_dashboard" class="back">
    ← Back to Dashboard
</a>

<h2>👥 Registered Users</h2>


<!-- SEARCH -->

<div class="search-box">

    <form action="/view_users" method="GET">

        <input
            type="text"
            name="search"
            placeholder="🔎 Search ID, Name, Email or Username..."
            value="{{ search }}"
        >

        <button type="submit">
            🔎 Search
        </button>

        <a href="/view_users" class="clear-btn">
            🔄 Clear
        </a>

    </form>

</div>


<!-- USERS TABLE -->

<div class="table-container">

<table>

<tr>

    <th>ID</th>
    <th>Full Name</th>
    <th>Email</th>
    <th>Username</th>

</tr>


{% if users %}

    {% for user in users %}

    <tr>

        <td>
            {{ user[0] }}
        </td>

        <td>
            {{ user[1] }}
        </td>

        <td>
            {{ user[2] }}
        </td>

        <td>
            {{ user[3] }}
        </td>

    </tr>

    {% endfor %}

{% else %}

    <tr>

        <td colspan="4" class="no-users">
            ❌ No users found.
        </td>

    </tr>

{% endif %}


</table>

</div>

</body>

</html>
